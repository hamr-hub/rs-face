[package]
name = "rs-face"
version = "0.1.0"
edition = "2021"
description = "Zero-dep Viola-Jones face detector in pure Rust, multi-threaded pipeline."
license = "MIT"

[lib]
name = "rsface"
path = "src/lib.rs"

[[bin]]
name = "rs-face"
path = "src/main.rs"

[[bench]]
name = "perf_compare"
path = "benches/perf_compare.rs"
harness = false

[dependencies]

# We intentionally keep ZERO runtime dependencies for the core library.
# Video decoding falls back to a std-only path (HTTP image stream or
# frame sequence) when no native decoder is compiled in.

# GPU backends. Each is gated so the library still builds with zero deps
# on hosts that only use the CPU cascade. The ``metal`` crate is enabled
# on macOS / Apple Silicon by default because OpenCL.framework is being
# phased out — Metal is the supported GPU path on current macOS.
metal = { version = "0.33", optional = true }

# Native CUDA backend (NVIDIA GPUs on Linux/Windows). Requires the CUDA
# toolkit and NVIDIA driver at runtime; ``cudarc`` 0.12 wraps the driver
# API + NVRTC just-in-time compiler. Off by default so the build stays
# zero-dep on hosts without an NVIDIA stack.
cudarc = { version = "0.12", optional = true }

[features]
default = []
metal-backend = ["dep:metal"]
cuda-backend  = ["dep:cudarc"]
opencv-backend = []  # placeholder for future opencv-rust binding

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Workspace-wide lint configuration. Each entry has a one-line rationale
# in the comments at the top of src/lib.rs / src/bin/*.rs. Putting them
# here means bins + tests + benches all inherit the same set without
# having to paste the block in every file.
[lints.rust]
unused_imports = "allow"
unused_mut = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_parens = "allow"
static_mut_refs = "allow"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"
identity_op = "allow"
erasing_op = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
manual_saturating_arithmetic = "allow"
manual_checked_ops = "allow"
unnecessary_cast = "allow"
io_other_error = "allow"
mut_from_ref = "allow"
redundant_closure = "allow"
redundant_clone = "allow"
clone_on_copy = "allow"
needless_pass_by_ref_mut = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
unnecessary_map_or = "allow"
while_let_loop = "allow"
new_without_default = "allow"
needless_collect = "allow"
unused_self = "allow"
needless_borrow = "allow"
single_match = "allow"
no_effect = "allow"
ptr_arg = "allow"
unnecessary_mut_passed = "allow"
cloned_ref_to_slice_refs = "allow"
