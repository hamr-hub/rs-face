[package]
name = "rs-face"
version = "0.2.0"
edition = "2021"
description = "Zero-dependency face detection & recognition in pure Rust: Viola-Jones Haar, LBPH/PCA/LDA recognisers, luminance/CNN detectors, optional ONNX (SCRFD/ArcFace) and GPU backends"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hamr-hub/rs-face"
homepage = "https://github.com/hamr-hub/rs-face"
documentation = "https://docs.rs/rs-face/latest/rsface/"
keywords = ["face-detection", "face-recognition", "haar-cascade", "lbph", "computer-vision"]
categories = ["computer-vision", "multimedia::images"]
# Keep the published crate small: the 458 MB models/ tree, the separate
# platform/ cargo project and local run outputs never ship. (cargo already
# honours .gitignore, but the package must stay small even if one of these
# is ever tracked.)
exclude = [
    "models/",
    "platform/",
    "data",
    "out/",
    "rsface-demo/",
    "target/",
    # Audit/regeneration copy of the OpenCV source XML (930 KB); only the
    # ~118 KB .rfcf is embedded at build time.
    "src/weights/*.xml",
    # Large photo fixtures used only by the opt-in ONNX real-model e2e test
    # (tests/real_model_e2e.rs). The default test suite only needs the small
    # lena.ppm + demo_face_256.pgm (the latter is include_bytes!-embedded).
    "tests/fixtures/biden.ppm",
    "tests/fixtures/two-people.ppm",
    # Annotated sample renders linked from the README on GitHub; no code or
    # test reads them, so they need not ship inside the crates.io tarball.
    "docs/samples/",
]
# benches/accuracy.rs is registered explicitly as a [[bin]] below; auto-discovery would
# also pick it up as a bench and emit a "multiple build targets" warning.
autobenches = false
# src/bin/prep_lbph_crops.rs needs ort-backend, so bins are listed explicitly below
# with required-features instead of relying on auto-discovery.
autobins = false
# Plain `cargo run` launches the CLI, not a "which binary?" error.
default-run = "rs-face"

[lib]
name = "rsface"
path = "src/lib.rs"

[[bin]]
name = "rs-face"
path = "src/main.rs"
# The CLI dispatches all three classical detectors through the pipeline;
# trimmed builds skip it rather than failing with unresolved imports.
required-features = [
    "detector-haar",
    "detector-luminance",
    "detector-cnn",
    "source",
    "source-http",
    "source-ffmpeg",
    "output",
    "pipeline",
    "batch",
]

[[bin]]
name = "bench_detect"
path = "src/bin/bench_detect.rs"
required-features = ["detector-haar"]

[[bin]]
name = "bench_lbph"
path = "src/bin/bench_lbph.rs"
required-features = ["recognizer-lbph"]

[[bin]]
name = "bench_eigenface"
path = "src/bin/bench_eigenface.rs"
required-features = ["recognizer-eigenface"]

[[bin]]
name = "bench_fisherface"
path = "src/bin/bench_fisherface.rs"
required-features = ["recognizer-fisherface"]

[[bin]]
name = "cnn_train"
path = "src/bin/cnn_train.rs"
required-features = ["detector-cnn"]

# Zero-dependency metric-learning trainer for the EmbedNet embedding
# network (contrastive pairs; writes .rsen weights for EmbedNet::load).
[[bin]]
name = "embednet_train"
path = "src/bin/embednet_train.rs"

[[bin]]
name = "debug_cascade"
path = "src/bin/debug_cascade.rs"
required-features = ["detector-haar"]

# Offline ArcFace labelling step for the LBPH accuracy bench — not part of the
# zero-dependency default build.
[[bin]]
name = "prep_lbph_crops"
path = "src/bin/prep_lbph_crops.rs"
required-features = ["ort-backend"]

[[bin]]
name = "rs_face_detect"
path = "src/bin/rs_face_detect.rs"
required-features = ["detector-haar", "source"]

[[bench]]
name = "perf_compare"
path = "benches/perf_compare.rs"
harness = false
required-features = ["detector-haar", "detector-cnn", "source"]

[[bench]]
name = "detect_640x480"
path = "benches/detect_640x480.rs"
harness = false
required-features = ["detector-haar", "source"]

[[bench]]
name = "iou_bench"
path = "benches/iou_bench.rs"
harness = false

[[bench]]
name = "integral_bench"
path = "benches/integral_bench.rs"
harness = false

[[bench]]
name = "perf_simd"
path = "benches/perf_simd.rs"
harness = false
required-features = ["detector-haar"]

[[bin]]
name = "bench-accuracy"
path = "benches/accuracy.rs"
required-features = ["ort-backend"]

# ---------------------------------------------------------------------------
# Examples — auto-discovery would build every one under every feature combo;
# explicit entries with required-features let trimmed builds skip them.
# ---------------------------------------------------------------------------
[[example]]
name = "cascade_dump"
required-features = ["detector-haar"]

[[example]]
name = "detect_haar"
required-features = ["detector-haar"]

[[example]]
name = "detect_scrfd_arcface"
required-features = ["ort-backend"]

[[example]]
name = "detect_uniform"
required-features = ["detector-haar", "detector-luminance", "recognizer-lbph"]

[[example]]
name = "identify_short_drama"
required-features = ["detector-haar", "recognizer-lbph", "video-id"]

[[example]]
name = "lena_classify_stages"
required-features = ["detector-haar"]

[[example]]
name = "recognise_eigenface"
required-features = ["recognizer-eigenface"]

[[example]]
name = "recognise_fisherface"
required-features = ["recognizer-fisherface"]

[[example]]
name = "recognise_lbph"
required-features = ["recognizer-lbph"]

[[example]]
name = "recognise_uniform"
required-features = [
    "recognizer-lbph",
    "recognizer-eigenface",
    "recognizer-fisherface",
]

[[example]]
name = "synthetic_smoke"
required-features = ["detector-haar"]

# Zero-dep landmark + tracker demos. Both modules live in the core
# (unconditional) part of the crate, so no feature gating is required.
[[example]]
name = "landmarks_demo"

[[example]]
name = "track_faces"

# ---------------------------------------------------------------------------
# Integration tests — same rationale as examples.
# ---------------------------------------------------------------------------
[[test]]
name = "batch_dir"
required-features = ["pipeline"]

[[test]]
name = "bench_components"
required-features = ["detector-haar"]

[[test]]
name = "integral_image_tests"
required-features = ["detector-haar"]

[[test]]
name = "algo_compat"
required-features = ["detector-haar", "detector-luminance"]

[[test]]
name = "cnn_scratch_tests"
required-features = ["detector-cnn"]

[[test]]
name = "bench_detect"
required-features = ["detector-haar"]

[[test]]
name = "real_model_e2e"
required-features = ["ort-backend"]

[[test]]
name = "inspect_algos"
required-features = ["detector-haar", "detector-luminance", "detector-cnn"]

[[test]]
name = "golden_eval"
required-features = ["detector-haar", "detector-luminance", "detector-cnn"]

[[test]]
name = "regression_dump"
required-features = ["detector-haar"]

[[test]]
name = "video_id_e2e"
required-features = ["video-id"]

[dependencies]

# We intentionally keep ZERO runtime dependencies for the core library.
# Video decoding falls back to a std-only path (HTTP image stream or
# frame sequence) when no native decoder is compiled in.

# GPU backends. Each is gated behind its own cargo feature so the default
# build keeps zero deps on hosts that only use the CPU detectors. The
# OpenCL driver is hand-rolled dlopen FFI in src/gpu/mod.rs and needs no
# crate dependency; Metal/CUDA pull in the crates below.
metal = { version = "0.33", optional = true }

# Native CUDA backend (NVIDIA GPUs on Linux/Windows). Requires the CUDA
# toolkit and NVIDIA driver at runtime; ``cudarc`` 0.12 wraps the driver
# API + NVRTC just-in-time compiler. Off by default so the build stays
# zero-dep on hosts without an NVIDIA stack.
cudarc = { version = "0.12", optional = true, features = ["cuda-12060"] }

# ---------------------------------------------------------------------------
# ONNX inference backends (both optional; default build stays zero-dep).
# ---------------------------------------------------------------------------
#
# Real industrial accuracy requires real trained CNN weights, which in practice
# means consuming ONNX. Two backends are offered because the right answer is
# genuinely deployment-dependent, and neither dominates:
#
#   ort   -- bindings to Microsoft ONNX Runtime. Best operator coverage and the
#            only route to GPU (CoreML / CUDA / TensorRT / DirectML / ROCm).
#            Costs a C++ runtime dependency and is currently a release candidate.
#   tract -- pure-Rust inference. Keeps the no-C++ / single-static-binary story
#            and cross-compiles cleanly. CPU-only and slower.
#
# The SCRFD/ArcFace pre- and post-processing in src/scrfd.rs and src/arcface.rs
# is backend-agnostic, so choosing one only swaps the forward pass.
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
] }
tract-onnx = { version = "0.23", optional = true }

[features]
# Drop-in default for 0.2.x users: every classical algorithm plus every
# std-only frame source. Everything below can now be trimmed individually —
# e.g. `--no-default-features --features recognizer-lbph,source`.
default = [
    "detector-haar",
    "detector-luminance",
    "detector-cnn",
    "recognizer-lbph",
    "recognizer-eigenface",
    "recognizer-fisherface",
    "source",
    "source-http",
    "source-ffmpeg",
    "output",
    "pipeline",
    "batch",
    "video-id",
]

# ---------------------------------------------------------------------------
# Detectors — each pulls in exactly its own algorithm + shared core types.
# ---------------------------------------------------------------------------
detector-haar = []
detector-luminance = []
detector-cnn = []

# ---------------------------------------------------------------------------
# Recognisers — independent of the detectors; pair them however you like.
# ---------------------------------------------------------------------------
recognizer-lbph = []
recognizer-eigenface = []
recognizer-fisherface = []

# ---------------------------------------------------------------------------
# Frame sources (`source` = trait + image-sequence + synthetic test pattern;
# HTTP MJPEG and the ffmpeg pipe are opt-in trimmables on top of it).
# ---------------------------------------------------------------------------
source = []
source-http = ["source"]
source-ffmpeg = ["source"]

# ---------------------------------------------------------------------------
# Orchestration — annotated writers, the multi-thread pipeline and the
# video-level tracker/clusterer. Pipeline is still haar-coupled (it owns the
# multi-scale cascade engine); the generic detector version lands later.
# ---------------------------------------------------------------------------
output = []
pipeline = ["detector-haar", "source", "output"]
video-id = ["source", "output"]

# ---------------------------------------------------------------------------
# Batch directory processor — walks a directory of images and emits per-image
# annotated PNGs plus a combined manifest. Lives behind `pipeline` so the
# zero-dep build stays zero-dep; no extra dependencies, just a thin wrapper
# over `detector::Detector` + `image::png`.
# ---------------------------------------------------------------------------
batch = ["pipeline"]

# Metal/CUDA are haar GPU backends, so they pull detector-haar with them.
metal-backend = ["dep:metal", "detector-haar"]
cuda-backend = ["dep:cudarc", "detector-haar"]

# ONNX Runtime backend: fastest, GPU-capable, pulls in a C++ runtime.
ort-backend = ["dep:ort"]
# Pure-Rust backend: no C++ toolchain, CPU-only.
tract-backend = ["dep:tract-onnx"]
# Convenience: any real-CNN capability at all. Code that only needs "is some
# ONNX backend present?" should gate on this rather than naming a backend.
onnx = ["ort-backend"]

# GPU execution providers for the ort backend. Kept separate from `ort-backend`
# because each one adds a large platform-specific toolchain requirement, and a
# user on a CPU-only server must not be forced to satisfy CUDA's.
ort-coreml = ["ort-backend", "ort/coreml"]
ort-cuda   = ["ort-backend", "ort/cuda"]
ort-tensorrt = ["ort-backend", "ort/tensorrt"]
ort-directml = ["ort-backend", "ort/directml"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Workspace-wide lint configuration. Each entry has a one-line rationale
# in the comments at the top of src/lib.rs / src/bin/*.rs. Putting them
# here means bins + tests + benches all inherit the same set without
# having to paste the block in every file.
[lints.rust]
unused_imports = "allow"
unused_mut = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_parens = "allow"
static_mut_refs = "allow"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"
identity_op = "allow"
erasing_op = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
manual_saturating_arithmetic = "allow"
# `manual_checked_ops` was renamed/removed in newer clippy; wrap in
# `[lints]` table with unknown_lints allow so CI works across toolchains.
# (Cargo treats this as a typo on stable Rust 1.92+, emitting E0602.)
unnecessary_cast = "allow"
io_other_error = "allow"
mut_from_ref = "allow"
redundant_closure = "allow"
redundant_clone = "allow"
clone_on_copy = "allow"
needless_pass_by_ref_mut = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
unnecessary_map_or = "allow"
while_let_loop = "allow"
new_without_default = "allow"
needless_collect = "allow"
unused_self = "allow"
needless_borrow = "allow"
single_match = "allow"
no_effect = "allow"
ptr_arg = "allow"
unnecessary_mut_passed = "allow"
cloned_ref_to_slice_refs = "allow"
