# rs-face Platform 一键部署:rustfs(S3) + postgres + rsface-server(Web/API)。
# 用法(在仓库根执行,构建上下文需要 core 源码):
#   docker compose -f platform/docker-compose.yml up -d --build
#
# Web 平台:    http://localhost:20080/
# S3 控制台:   http://localhost:19000/
# PostgreSQL:  localhost:15432 (rsface/rsface)
#
# 可调参数(默认值见下方 ${...:-...});复制 platform/.env.example 到
# 仓库根 .env 可改密钥/密码/资源上限。控制台端口只绑 127.0.0.1,
# 不对 LAN 暴露;server 走 host 网络绑 0.0.0.0:20080(产品需要)。

services:
  rustfs:
    # 固定到具体版本,不跟 latest:升级是显式动作,避免重建时意外换版本。
    image: rustfs/rustfs:1.0.0
    container_name: rsface-rustfs
    # 以 hyx (UID:GID = 1000:1000) 运行,这样 bind mount 到 ../data/rustfs/
    # 创建的对象在宿主侧也是 hyx:hyx,无需 root 写。镜像默认以 root 运行
    # 会让 data/rustfs/ 出现 root-owned 目录,后续 hyx 跑 `rm` / `du` 都会
    # 触发 Permission denied。
    # 注意:已有的 root-owned data/rustfs/ 内容需要先
    #   sudo chown -R 1000:1000 data/rustfs
    # 否则容器启动后会拒读旧对象。
    user: "1000:1000"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rsface}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rsface-secret}
      RUSTFS_VOLUMES: /data
    ports:
      # 仅本机访问:控制台不向 LAN 开放(server 经 host 网络走 127.0.0.1 访问)。
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      # bind mount 到 data/rustfs/ (项目内,跟随代码可见)。
      - ../data/rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${RUSTFS_MEM_LIMIT:-1g}
    restart: unless-stopped

  postgres:
    # 固定 minor 版本(16.15),只跟安全补丁的升级走显式改标签。
    image: postgres:16.15-alpine
    container_name: rsface-postgres
    # 以 hyx (UID:GID = 1000:1000) 运行,跟 rustfs + server 对齐,
    # 这样 bind mount 到 ../data/pg/pgdata/ 创建的文件也是 1000:1000,
    # host hyx 可读 / 可备份,无需 root 介入。
    user: "1000:1000"
    environment:
      POSTGRES_DB: rsface
      POSTGRES_USER: rsface
      # 密码可在 .env 里覆盖(DATABASE_URL 必须同步用同一变量)。
      # 注意:密码不要含 @ : / ? 等 URL 特殊字符,否则 DATABASE_URL 解析失败。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsface-pass}
    ports:
      # 仅本机访问:DB 不向 LAN 暴露。
      - "127.0.0.1:15432:5432"
    volumes:
      # bind mount 到 data/pg/pgdata/ (项目内,跟随代码可见)。
      # 首次启动为空目录 → postgres 自动 initdb;dump 还原走 DOCKER.md「备份/恢复」
      # 节的 `docker exec -i rsface-postgres pg_restore ...` 命令
      - ../data/pg/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsface -d rsface"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${PG_MEM_LIMIT:-512m}
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    image: rsface-server:latest
    container_name: rsface-server
    # 以 hyx (UID:GID = 1000:1000) 运行 —— 跟 rustfs + postgres 对齐,
    # 这样 bind mount 到 ../data/media/ 创建的对象宿主侧也是 1000:1000,
    # host hyx 可读可删可备份;之前镜像内 UID 10001 落到 host "other"
    # (data/media 是 775 / owner=1000) 会触发 Permission denied,导致
    # 所有 original.jpg 走 inline fallback → 前端 404。
    user: "1000:1000"
    # host 网络模式:server 直接绑 host 的 0.0.0.0:20080,绕开 docker iptables NAT。
    # 跟 rustfs / postgres 走 127.0.0.1:<host-mapped-port> 通信。
    network_mode: host
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:20080
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rsface}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rsface-secret}
      S3_BUCKET: rsface
      # S3 瞬态失败重试:4 次尝试(1 + 3 retry),指数退避 100ms → 2s 上限。
      S3_MAX_RETRIES: ${S3_MAX_RETRIES:-4}
      S3_RETRY_BASE_MS: ${S3_RETRY_BASE_MS:-100}
      S3_RETRY_MAX_MS: ${S3_RETRY_MAX_MS:-2000}
      RSFACE_CASCADE: /app/cascade.rfcf
      WEB_DIR: /app/web
      TMP_DIR: /tmp/rsface-jobs
      MAX_FRAMES_VIDEO: ${MAX_FRAMES_VIDEO:-3600}
      MAX_FACE_CROPS: ${MAX_FACE_CROPS:-2000}
      MIN_FACE_SIZE: ${MIN_FACE_SIZE:-24}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-64}
      # 任务硬超时(可配 0 关闭):图片 10min / 视频 60min / 流不限。
      JOB_TIMEOUT_SECS: ${JOB_TIMEOUT_SECS:-600}
      JOB_TIMEOUT_VIDEO_SECS: ${JOB_TIMEOUT_VIDEO_SECS:-3600}
      JOB_TIMEOUT_STREAM_SECS: ${JOB_TIMEOUT_STREAM_SECS:-0}
      # 优雅停机:SIGTERM 后等任务排空的上限(docker stop 默认只等 10s,
      # 需配 stop_grace_period 一起调大)。
      SHUTDOWN_GRACE_SECS: ${SHUTDOWN_GRACE_SECS:-120}
      DATABASE_URL: postgres://rsface:${POSTGRES_PASSWORD:-rsface-pass}@127.0.0.1:15432/rsface
      # PG 连接池大小:默认 16,留余量给 SSE telemetry + janitor 心跳。
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      LOCAL_MEDIA_DIR: /var/rsface-media
      # 跨域前端(留空 = 同源部署,不开 CORS)
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}
      RSFACE_GALLERY_DIR: /var/rsface-gallery
    volumes:
      # bind mount 到 data/media/ (项目内,跟随代码可见)。
      - ../data/media:/var/rsface-media
      # 注册人脸画廊(每个子目录一个身份)。目录可为空:为空时
      # /recognize 返回 no_gallery,不影响检测类接口。
      - ../data/gallery:/var/rsface-gallery
    healthcheck:
      # host 网络模式下容器内 wget 打自己端口(alpine 镜像没装 curl)。
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:20080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    # 资源限制:检测线程 + ffmpeg 子进程 + 上传缓冲的合理上限。
    # 2G:足以跑 2 并发 haar/cnn + 2GB 上限的视频转码;OOM 时容器重启
    # (restart: unless-stopped)而不是拖垮宿主。
    mem_limit: ${SERVER_MEM_LIMIT:-2g}
    memswap_limit: ${SERVER_MEMSWAP_LIMIT:-2g}
    # docker stop 的宽限期要 ≥ SHUTDOWN_GRACE_SECS,让优雅停机跑完。
    stop_grace_period: ${SERVER_STOP_GRACE:-2m30s}
    restart: unless-stopped

# 注意:本 compose 全部使用 bind mount,无 docker named volume。
# 数据目录(都在项目根 data/ 下,跟随代码可见,便于备份):
#   data/rustfs/    - rustfs S3 对象存储
#   data/pg/pgdata/ - postgres 数据库 (首次启动会 initdb)
#   data/media/     - 上传媒体 + 检测结果
# 数据恢复:把 rsface_dump.sqlc 放到 data/pg/ 后,执行:
#   docker exec -i rsface-postgres pg_restore -U rsface -d rsface --no-owner --role=rsface < data/pg/rsface_dump.sqlc
