[package]
name = "rsface-platform"
version = "0.1.0"
edition = "2021"
description = "rs-face platform server: web API, job engine, S3 (rustfs) storage. Uses rsface core as SDK."
license = "MIT"

[[bin]]
name = "rsface-server"
path = "server/src/main.rs"

[lib]
name = "rsface_platform"
path = "server/src/lib.rs"

[dependencies]
# 人脸识别核心库(SDK)。core 保持零依赖,平台层在此引入服务端依赖。
# 包名为 rs-face,lib 名为 rsface;此处重命名为 rsface 以便 `use rsface::…`。
rsface = { package = "rs-face", path = ".." }

# Web 服务
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tower-http 中间件:gzip 压缩 + ETag/Cache-Control 给静态资源。
# 选 `compression-gzip` + `set-header` + `cors` 是为了不引入多余依赖。
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "set-header", "trace"] }

# S3 (rustfs) 客户端:仅 HTTP,无 TLS 依赖(内网通信)
ureq = { version = "2", default-features = false }

# AWS SigV4 签名所需
sha2 = "0.10"
hmac = "0.12"

# PostgreSQL(任务/帧/人脸持久化)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate"] }

# 结构化日志:统一替代散落的 eprintln!。仅 platform 引入,
# core 仍保持零依赖。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
# 集成测试:跑整个 axum router 起来 + 用 reqwest 模拟真实 HTTP 请求。
# 不引入 reqwest 之外的服务容器依赖;集成测试假设有 rustfs / postgres 在
# 127.0.0.1 跑,没起来就跳过。
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
