[package]
name = "eval-m1"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone M1 evaluation harness. NOT part of the rs-face crate or its workspace:
# it depends on rs-face by path and only exercises its public API.
[[bin]]
name = "eval-m1"
path = "main.rs"

[dependencies]
rs-face = { path = "../..", features = ["ort-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
