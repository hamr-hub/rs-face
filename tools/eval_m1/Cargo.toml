[package]
name = "eval-m1"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone M1 evaluation harness. NOT part of the rs-face crate or its workspace:
# it depends on rs-face by path and only exercises its public API.
[[bin]]
name = "eval-m1"
path = "main.rs"

# Layer-by-layer diagnostic: is the 0-recall a decode bug, a preprocess bug, or
# a post-process bug? Dumps raw model scores so the threshold is never the
# suspect by assumption.
[[bin]]
name = "diagnose"
path = "diagnose.rs"

# Pixel-accuracy grader for the hand-rolled JPEG decoder, against PIL/libjpeg
# as the oracle. The dimension-only tests in tests/jpeg_decode.rs cannot catch a
# wrong-pixel decode; this one grades exactly that.
[[bin]]
name = "jpeg_oracle"
path = "jpeg_oracle.rs"

# Per-image pipeline dump (2026-09-30): decode → detect → align → embed, writing
# decoded.png + cropNN.png to a directory so a wrong-looking crop can be
# distinguished from a wrong-looking decode at a glance. Answers "where did this
# image lose its identity" rather than only reporting a similarity number.
[[bin]]
name = "dump"
path = "dump.rs"

[dependencies]
rs-face = { path = "../..", features = ["ort-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
