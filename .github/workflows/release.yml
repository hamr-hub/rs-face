name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # ------- Core CLI: rs-face (zero-dep) -------
  cli:
    name: rs-face (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: rs-face-linux-x86_64
            binary: target/release/rs-face
          - target: aarch64-unknown-linux-gnu
            artifact: rs-face-linux-aarch64
            binary: target/aarch64-unknown-linux-gnu/release/rs-face
          - target: x86_64-apple-darwin
            artifact: rs-face-macos-x86_64
            binary: target/x86_64-apple-darwin/release/rs-face
          - target: aarch64-apple-darwin
            artifact: rs-face-macos-aarch64
            binary: target/aarch64-apple-darwin/release/rs-face
          - target: x86_64-pc-windows-gnu
            artifact: rs-face-windows-x86_64.exe
            binary: target/x86_64-pc-windows-gnu/release/rs-face.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build rs-face
        run: cargo build --release --bin rs-face --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p out
          cp ${{ matrix.binary }} out/${{ matrix.artifact }}
          chmod +x out/${{ matrix.artifact }} || true
          (cd out && tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }})

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ------- Platform server: rsface-server (Linux only) -------
  # The platform server depends on tokio + axum + sqlx + ureq and is
  # primarily deployed via the Docker images in platform/Dockerfile*.
  # We build the binary here so users can run it without Docker.
  platform-linux:
    name: rsface-server (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # sqlx needs DATABASE_URL at build time for compile-time query
      # checking. We point it at a temporary offline file so the build
      # succeeds even though we never connect.
      - name: Provide stub DATABASE_URL
        run: |
          echo "DATABASE_URL=postgres://localhost/_unused" > platform/.env

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
            target
          key: ${{ runner.os }}-cargo-platform-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-platform-

      - name: Build platform server
        working-directory: platform
        run: |
          cargo build --release --bin rsface-server
          cp target/release/rsface-server ../rsface-server-linux-x86_64
        env:
          SQLX_OFFLINE: true

      - name: Package platform server
        run: |
          tar -czf rsface-server-linux-x86_64.tar.gz rsface-server-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsface-server-linux-x86_64
          path: rsface-server-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ------- Publish a GitHub Release -------
  release:
    name: Publish release
    needs: [cli, platform-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
