name: CI

# Push/PR gate. Mirrors CONTRIBUTING.md "Coding conventions",
# STRUCTURE.md §3 (pre-commit self-check), and tools/pre-push.sh:
#   fmt --check -> clippy -D warnings -> zero-dep build/test -> test,
# for BOTH the zero-dep core crate and the platform server crate.
# The core job additionally runs the synthetic-input CLI smoke test.
# Optional GPU/ONNX backends (metal/cuda/ort/tract) are not built here —
# they need platform toolchains and are validated manually.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: clippy (-D warnings, release/all-targets)
        run: cargo clippy --release --all-targets -- -D warnings

      # The headline claim is "zero runtime deps by default": build and
      # test the lib with no features so an accidental default dep fails CI.
      - name: zero-dep build
        run: cargo build --no-default-features --lib
      - name: zero-dep test
        run: cargo test --lib --no-default-features

      - name: full build + lib tests
        run: |
          cargo build --release --all-targets
          cargo test --lib

      - name: Smoke test on synthetic input
        run: |
          ./target/release/rs-face test://5 --out /tmp/rsface-smoke
          test -f /tmp/rsface-smoke/manifest.json

  tract-feature:
    # The pure-Rust ONNX backend must keep compiling even though the default
    # build is zero-dep. cuda-backend is intentionally NOT gated on hosted
    # runners (no CUDA toolkit -> always fails); validate it on a GPU host.
    name: feature gate (tract-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --features tract-backend
        run: cargo check --features tract-backend --lib

  platform:
    name: platform server (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: ${{ runner.os }}-platform-cargo-${{ hashFiles('platform/Cargo.lock', 'platform/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-platform-cargo-

      - name: cargo fmt --check
        working-directory: platform
        run: cargo fmt --all --check

      - name: clippy (-D warnings, all-targets)
        working-directory: platform
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        working-directory: platform
        run: cargo build

      - name: test
        working-directory: platform
        run: cargo test
