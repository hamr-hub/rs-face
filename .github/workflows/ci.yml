name: CI

# Push/PR gate. Mirrors CONTRIBUTING.md "Coding conventions",
# STRUCTURE.md §3 (pre-commit self-check), and tools/pre-push.sh:
#   fmt --check -> clippy -D warnings -> minimal-core build/test ->
#   per-feature build/test matrix -> full default build/test,
# for BOTH the core crate and the platform server crate.
# The core job additionally runs the synthetic-input CLI smoke test.
# metal/cuda/ort are not built on hosted runners (platform toolchains);
# tract-backend is pure Rust and is part of the feature matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: clippy (-D warnings, release/all-targets)
        run: cargo clippy --release --all-targets -- -D warnings

      # Minimal core: only the always-compiled types (image, face,
      # embedding, traits). An accidental non-core dependency here fails CI.
      - name: minimal-core build
        run: cargo build --no-default-features --lib
      - name: minimal-core test
        run: cargo test --lib --no-default-features

      # rustdoc is strict about intra-doc links: feature-gated modules must
      # be referenced as plain code, or `cargo doc` breaks for default users.
      - name: rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

      - name: full default build + lib tests
        run: |
          cargo build --release --all-targets
          cargo test --lib

      - name: Smoke test on synthetic input
        run: |
          ./target/release/rs-face test://5 --out /tmp/rsface-smoke
          test -f /tmp/rsface-smoke/manifest.json

  features:
    # Every trimming knob must compile AND pass its own module tests on top
    # of the minimal core. cuda/metal/ort are intentionally absent (hosted
    # runners lack the toolchains); validate them on the matching GPU host.
    name: feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - detector-haar
          - detector-luminance
          - detector-cnn
          - recognizer-lbph
          - recognizer-eigenface
          - recognizer-fisherface
          - source
          - source-http
          - source-ffmpeg
          - output
          - pipeline
          - video-id
          - tract-backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build + lib tests (${{ matrix.features }})
        run: >
          cargo test --release --lib
          --no-default-features
          --features "${{ matrix.features }}"

  platform:
    name: platform server (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: ${{ runner.os }}-platform-cargo-${{ hashFiles('platform/Cargo.lock', 'platform/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-platform-cargo-

      - name: cargo fmt --check
        working-directory: platform
        run: cargo fmt --all --check

      - name: clippy (-D warnings, all-targets)
        working-directory: platform
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        working-directory: platform
        run: cargo build

      - name: test
        working-directory: platform
        run: cargo test

      - name: rustdoc (deny warnings)
        working-directory: platform
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items
