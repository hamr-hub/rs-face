name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --release --all-targets

      - name: cargo test (lib)
        run: cargo test --lib

      - name: Smoke test on synthetic input
        run: |
          ./target/release/rs-face test://5 --out /tmp/rsface-smoke
          test -f /tmp/rsface-smoke/manifest.json

  zero-dep-build:
    # The headline claim is "zero runtime deps by default". This job enforces
    # it: build the lib with --no-default-features and confirm no optional
    # crate sneaked in. If a future change accidentally pulls in a dep via
    # the default feature set, this job catches it before a release.
    name: zero-dep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --no-default-features
        run: cargo build --no-default-features --lib
      - name: cargo test --lib --no-default-features
        run: cargo test --lib --no-default-features

  feature-gates:
    # Every documented optional backend must still build. If a feature
    # silently bit-rots, this job catches it.
    name: feature gates (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - tract-backend
          - cuda-backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --features ${{ matrix.feature }}
        run: cargo check --features ${{ matrix.feature }} --lib

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings